<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>GoodShift - Employee Scheduling</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding:24px;font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:40px auto;line-height:1.5">
          <h2 style="margin:0 0 12px">JavaScript is required</h2>
          <p>GoodShift needs JavaScript enabled to run. Please enable it in your browser settings and reload this page.</p>
        </div>
      </noscript>
    </div>
    <script>
      // Catches script-load / parse errors (e.g. on older iPad Safari versions
      // that don't support modern JS syntax). If the React app fails to mount
      // within 8 seconds OR the bundle throws on parse, replace the blank
      // screen with a readable message + version info we can ask the user for.
      (function () {
        var shown = false;
        function showFallback(detail) {
          if (shown) return;
          shown = true;
          var root = document.getElementById("root");
          if (!root) return;
          if (root.hasAttribute("data-app-mounted")) return;
          root.innerHTML =
            '<div style="padding:24px;font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:40px auto;line-height:1.5">' +
              '<h2 style="margin:0 0 12px">GoodShift could not load</h2>' +
              '<p>This usually means your browser is out of date. Please update your device to the latest iOS / iPadOS (or use a newer browser), then reload this page.</p>' +
              '<p style="color:#666;font-size:12px;margin-top:24px"><strong>Diagnostic info (share with IT):</strong><br>' +
                'Browser: ' + (navigator.userAgent || "unknown") + '<br>' +
                'Error: ' + (detail || "blank-screen-timeout") +
              '</p>' +
              '<p><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;font-size:14px;cursor:pointer">Reload</button></p>' +
            '</div>';
        }
        window.addEventListener("error", function (e) {
          // Only treat as fatal if nothing has mounted yet
          var root = document.getElementById("root");
          if (root && !root.hasAttribute("data-app-mounted")) {
            showFallback((e && e.message) || "script error");
          }
        });
        window.setTimeout(function () { showFallback("timeout"); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
